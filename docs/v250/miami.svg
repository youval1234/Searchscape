<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" data-scene="miami"><title>GTA VI · Miami</title><style>:root { --m-bay:#c7ddd7; --m-pavement:#b2c4c4; --m-foam:#f3ebda; --m-palm:#477276; --m-distant:#c6b6bd; --m-stucco:#f0c9bc; --m-shadow:#bc9ca6; --m-glass:#728f9d; --scene-haze:#eed6cf; }
@media(prefers-color-scheme:dark){:root { --m-bay:#263c49; --m-pavement:#394352; --m-foam:#699b9c; --m-palm:#385761; --m-distant:#544657; --m-stucco:#926c76; --m-shadow:#624f64; --m-glass:#4a6877; --scene-haze:#604153; }}
:root .miami-leaves { animation: miami-breeze 6s ease-in-out infinite alternate; }
:root .miami-tide { animation: miami-tide 9s ease-in-out infinite alternate; }
.miami-glint { opacity:0; }
:root .miami-glint { stroke-dasharray:16 110; animation:miami-chrome 11s -3s ease-in-out infinite; }
@keyframes miami-breeze { from { transform:rotate(-3deg); } to { transform:rotate(5deg); } }
@keyframes miami-tide { from { transform:translateX(-12px); } to { transform:translateX(16px); } }
@keyframes miami-chrome { 0%,18% { opacity:0;stroke-dashoffset:20; } 35%,53% { opacity:.8; } 68%,100% { opacity:0;stroke-dashoffset:-100; } }

:root{--paper:#fff1eb}@media(prefers-color-scheme:dark){:root{--paper:#151426}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="backdrop" x2=".12" y2="1"><stop stop-color="var(--paper)"/><stop offset="1" stop-color="var(--scene-haze)"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#backdrop)"/>
      <defs>
        <linearGradient id="m-car" x2=".2" y2="1"><stop stop-color="#ffd1a5"/><stop offset=".38" stop-color="#e98c80"/><stop offset="1" stop-color="#a95268"/></linearGradient>
        <linearGradient id="m-glass" x2="1" y2="1"><stop stop-color="#95ccc4"/><stop offset="1" stop-color="#47687a"/></linearGradient>
        <linearGradient id="m-hotel" x2="1" y2=".6"><stop stop-color="var(--m-stucco)"/><stop offset="1" stop-color="var(--m-shadow)"/></linearGradient>
        <path id="m-frond" d="M0 0Q31-49 86-29Q65-33 53-22L50-26 37-15 35-19 23-8 22-12Z"/>
        <g id="m-palm"><path d="M-7 0Q-9-84 19-163L25-163Q2-80 6 0Z" fill="var(--m-palm)"/><g transform="translate(22 -162)"><g class="miami-leaves" fill="var(--m-palm)">
          <use href="#m-frond"/><use href="#m-frond" transform="rotate(28)"/><use href="#m-frond" transform="rotate(62) scale(.85)"/><use href="#m-frond" transform="scale(-1 1) rotate(4)"/><use href="#m-frond" transform="scale(-1 1) rotate(44)"/><use href="#m-frond" transform="rotate(-39) scale(.8)"/>
        </g></g></g>
        <g id="m-wheel"><circle r="21" fill="#373b50"/><circle r="13" fill="#98abb2"/><circle r="8" fill="#46596a"/><path d="M-8-4 1-10 8-6" fill="none" stroke="#f4d4be" stroke-width="2.5"/></g>
      </defs>
      <svg width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice"><path d="M0 709Q290 666 558 714T1112 722Q1382 685 1600 701V1000H0Z" fill="var(--m-bay)"/>
        <path d="M0 790Q247 748 453 777T945 790Q1225 751 1600 764" fill="none" stroke="var(--m-foam)" stroke-width="2" opacity=".45"/>
